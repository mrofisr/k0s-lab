# Cilium phase 2: kube-proxy replacement.
# k0s kube-proxy is disabled only after Cilium reports
# KubeProxyReplacement=True and service traffic has been verified.
cluster:
  name: k0s-lab
  id: 1

ipam:
  mode: kubernetes

kubeProxyReplacement: "true"
# Cilium must reach the API server directly once kube-proxy is gone.
k8sServiceHost: 10.0.0.81
k8sServicePort: 6443

# Required with Istio: keep socket load balancing out of pod namespaces so
# Istio's redirection still sees the original ClusterIP.
socketLB:
  hostNamespaceOnly: true

# Allow the Istio CNI plugin to chain with Cilium later.
cni:
  exclusive: false

# Istio ambient does not support Cilium BPF masquerading. Keep the default
# iptables masquerading implementation instead.
bpf:
  masquerade: false

# The host NIC reports MTU 9000, but the lab clients are on 1500.
# The Cilium chart key is uppercase MTU.
MTU: 1500

operator:
  replicas: 1

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
