apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: k0s-lab
spec:
  hosts:
    - ssh:
        address: 10.0.0.81
        user: ubuntu
        port: 22
        keyPath: /home/ubuntu/.ssh/k0s-lab
      role: controller+worker
      noTaints: true
      k0sInstallPath: /home/ubuntu/.local/bin/k0s
  k0s:
    version: v1.36.6+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: k0s-lab
      spec:
        api:
          sans:
            - 10.0.0.81
            - k0s-lab.local
        network:
          provider: custom
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
          # Cilium replaces kube-proxy; see cilium/values.yaml.
          kubeProxy:
            disabled: true
        telemetry:
          enabled: false
