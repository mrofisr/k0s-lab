apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: skopos-lab-ca
  secretName: lab-ca-key-pair
  duration: 87600h
  issuerRef:
    name: lab-selfsigned
    kind: Issuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
