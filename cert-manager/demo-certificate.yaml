apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-local
  namespace: istio-system
spec:
  secretName: demo-local-tls
  commonName: demo.local
  dnsNames:
    - demo.local
  issuerRef:
    name: lab-ca
    kind: ClusterIssuer
    group: cert-manager.io
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
